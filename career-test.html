<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 빌더 성향 테스트 - 구름 AI 캠퍼스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #0f172a; /* slate-900 */
            color: #f8fafc; /* slate-50 */
        }

        .fade-in {
            animation: fadeIn 0.4s ease-in forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .option-btn {
            transition: all 0.2s ease;
        }
        
        .option-btn:hover {
            transform: translateY(-2px);
            border-color: #3b82f6; /* blue-500 */
            background-color: #1e293b; /* slate-800 */
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .loader {
            border: 4px solid #1e293b;
            border-bottom-color: #3b82f6;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 메인 컨테이너 -->

                title: "AI 네이티브 데이터 모델 설계 엔지니어",
                subtitle: "데이터를 의사결정의 언어로 통역하는 분석 설계자",
                desc: "당신은 직감보다 정확한 근거와 논리적인 구조를 바탕으로 문제를 해결하는 타입입니다. SQL과 dbt를 활용해 클라우드 DW를 구축하고, 데이터 품질과 지표를 설계하며, RAG 기반 분석 시스템의 뇌를 세팅하는 데이터 모델 과정과 최고의 시너지를 냅니다.",
                icon: "bar-chart-3",
                colorClass: "text-amber-400",
                bgClass: "bg-amber-500/20",
                ringClass: "ring-amber-500/50"
            },
            E: {
                title: "AI 네이티브 보안 엔지니어",
                subtitle: "AI 서비스의 절대적 신뢰를 지켜내는 리스크 헌터",
                desc: "당신은 남들이 보지 못하는 시스템의 허점을 먼저 발견하고, 안전한 구조로 개선하는 데 뛰어난 통찰력을 가졌습니다. 레드팀이 되어 AI 취약점을 검증하고, Llama Guard 같은 지능형 가드레일을 운영하며 무결점 AI를 완성하는 보안 엔지니어 과정에 도전하세요.",
                icon: "shield-alert",
                colorClass: "text-rose-400",
                bgClass: "bg-rose-500/20",
                ringClass: "ring-rose-500/50"
            }
        };

        // DOM Elements
        const screens = {
            intro: document.getElementById('intro-screen'),
            question: document.getElementById('question-screen'),
            loading: document.getElementById('loading-screen'),
            result: document.getElementById('result-screen')
        };
        const questionTitle = document.getElementById('question-title');
        const optionsContainer = document.getElementById('options-container');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');

        // Functions
        function switchScreen(screenId) {
            Object.values(screens).forEach(screen => {
                screen.classList.add('hidden');
                screen.classList.remove('fade-in');
            });
            screens[screenId].classList.remove('hidden');
            // Force reflow for animation
            void screens[screenId].offsetWidth; 
            screens[screenId].classList.add('fade-in');
        }

        function startTest() {
            currentQuestionIndex = 0;
            scores = { A: 0, B: 0, C: 0, D: 0, E: 0 };
            switchScreen('question');
            renderQuestion();
        }

        function renderQuestion() {
            const currentQ = questions[currentQuestionIndex];
            
            // Update Progress
            progressText.innerText = `${currentQuestionIndex + 1} / ${questions.length}`;
            progressBar.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
            
            // Render Title
            questionTitle.innerHTML = currentQ.q;
            
            // Render Options (Shuffle them slightly for UX, or keep static. Keeping static for now)
            optionsContainer.innerHTML = '';
            currentQ.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-left p-4 sm:p-5 bg-slate-900 border border-slate-700 rounded-xl text-slate-200 text-sm sm:text-base leading-snug";
                btn.innerHTML = opt.text;
                btn.onclick = () => handleOptionSelect(opt.type);
                optionsContainer.appendChild(btn);
            });
        }

        function handleOptionSelect(type) {
            scores[type]++;
            
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                
                // Add a small fade effect for the next question
                optionsContainer.style.opacity = '0';
                questionTitle.style.opacity = '0';
                
                setTimeout(() => {
                    renderQuestion();
                    optionsContainer.style.opacity = '1';
                    questionTitle.style.opacity = '1';
                    optionsContainer.style.transition = 'opacity 0.2s';
                    questionTitle.style.transition = 'opacity 0.2s';
                }, 200);

            } else {
                calculateResult();
            }
        }

        function calculateResult() {
            switchScreen('loading');
            
            // Find max score
            let maxType = 'A';
            let maxScore = scores['A'];
            for (const [type, score] of Object.entries(scores)) {
                if (score > maxScore) {
                    maxScore = score;
                    maxType = type;
                }
            }

            setTimeout(() => {
                showResult(maxType);
            }, 1500); // 1.5s loading time for anticipation
        }

        function showResult(type) {
            const res = resultData[type];
            
            // Update Result DOM
            document.getElementById('result-title').innerText = res.title;
            document.getElementById('result-subtitle').innerText = res.subtitle;
            document.getElementById('result-desc').innerText = res.desc;
            
            // Update Icon
            const iconContainer = document.getElementById('result-icon-container');
            iconContainer.className = `w-20 h-20 rounded-2xl flex items-center justify-center mb-6 ring-4 ${res.bgClass} ${res.ringClass}`;
            iconContainer.innerHTML = `<i data-lucide="${res.icon}" class="w-10 h-10 ${res.colorClass}"></i>`;
            
            lucide.createIcons();
            switchScreen('result');
        }

        function resetTest() {
            startTest();
        }

    </script>
</body>
</html>
